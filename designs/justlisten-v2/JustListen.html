<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>别看字 · JustListen — Bilibili 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* ============================================================
   别看字 · JustListen — design tokens
   Brand: Apple-like / Minimal / Calm / Invisible · Frosted Glass
   ============================================================ */
:root{
  /* Bilibili host chrome */
  --bili-pink:#FB7299;
  --bili-blue:#00AEEC;
  --bili-page:#F1F2F3;
  --bili-card:#FFFFFF;
  --ink-1:#18191C;
  --ink-2:#61666D;
  --ink-3:#9499A0;
  --line:#E3E5E7;

  /* JustListen material — calm, near-monochrome, one restrained blue */
  --jl-accent:#0A84FF;          /* Apple system blue, used sparingly for "active" */
  --jl-accent-soft:rgba(10,132,255,.14);
  --jl-glass:rgba(20,22,28,.34);      /* frosted panel tint over media */
  --jl-glass-hi:rgba(255,255,255,.10);
  --jl-stroke:rgba(255,255,255,.20);
  --jl-stroke-soft:rgba(255,255,255,.12);
  --jl-text:rgba(255,255,255,.94);
  --jl-text-2:rgba(255,255,255,.62);
  --jl-text-3:rgba(255,255,255,.40);
  --jl-shadow:0 8px 30px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.18);

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font);
  background:var(--bili-page);
  color:var(--ink-1);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
::selection{ background:var(--jl-accent-soft); }

/* thin, quiet scrollbars */
.jl-scroll::-webkit-scrollbar{ width:8px; height:8px; }
.jl-scroll::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.14); border-radius:99px; }
.jl-scroll::-webkit-scrollbar-track{ background:transparent; }
.jl-scroll-dark::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.16); }

/* ======================= Bilibili host ======================= */
.page{ min-height:100vh; }

.bili-header{
  position:sticky; top:0; z-index:60;
  height:64px; background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:26px;
  padding:0 24px;
}
.bili-logo{ font-weight:800; font-size:22px; letter-spacing:-.5px; color:var(--bili-blue); display:flex; align-items:center; gap:2px; }
.bili-logo b{ color:var(--bili-pink); }
.bili-nav{ display:flex; gap:22px; align-items:center; font-size:15px; color:var(--ink-1); }
.bili-nav a{ color:inherit; text-decoration:none; display:flex; align-items:center; gap:3px; white-space:nowrap; }
.bili-nav a:hover{ color:var(--bili-blue); }
.bili-search{
  flex:1; max-width:520px; height:38px; margin:0 auto;
  background:#F1F2F3; border:1px solid transparent; border-radius:10px;
  display:flex; align-items:center; padding:0 6px 0 16px; gap:8px; color:var(--ink-3);
  transition:.2s var(--ease);
}
.bili-search:hover{ background:#fff; border-color:var(--line); }
.bili-search input{ flex:1; border:none; outline:none; background:none; font-size:14px; color:var(--ink-1); }
.bili-search .go{ width:52px; height:30px; border-radius:8px; background:#F1F2F3; display:grid; place-items:center; color:var(--ink-2); }
.bili-actions{ display:flex; align-items:center; gap:20px; color:var(--ink-2); font-size:12px; }
.bili-actions .ba{ display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; }
.bili-avatar{ width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#ffd3a5,#fd6585); background-size:cover; }
.badge{ position:absolute; top:-6px; right:2px; background:var(--bili-pink); color:#fff; font-size:9px; line-height:1; padding:2px 4px; border-radius:99px; }
.btn-post{ background:var(--bili-pink); color:#fff; font-size:14px; font-weight:600; height:34px; padding:0 16px; border-radius:8px; display:flex; align-items:center; gap:6px; }

.bili-main{
  max-width:2000px; margin:0 auto; padding:20px 40px 80px;
  display:grid; grid-template-columns:minmax(0,1fr) 350px; gap:24px; align-items:start;
}
.video-col{ min-width:0; }

.video-title{ font-size:20px; font-weight:600; line-height:1.4; color:var(--ink-1); margin:4px 0 8px; }
.video-meta{ display:flex; align-items:center; gap:16px; color:var(--ink-3); font-size:13px; margin-bottom:14px; }
.video-meta .m{ display:flex; align-items:center; gap:5px; }

/* ----- Player stage ----- */
.stage-wrap{ position:relative; }
.player{
  position:relative; width:100%; aspect-ratio:16/9;
  background:#000; border-radius:6px; overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.1);
}
/* fallback cinematic night-garden scene (until real frame is dropped in) */
.video-scene{
  position:absolute; inset:0;
  background:
    radial-gradient(120px 120px at 22% 34%, rgba(255,214,120,.45), transparent 60%),
    radial-gradient(70px 70px at 78% 52%, rgba(255,170,90,.40), transparent 60%),
    radial-gradient(50px 50px at 60% 22%, rgba(255,230,160,.30), transparent 60%),
    radial-gradient(40px 40px at 40% 70%, rgba(255,200,120,.30), transparent 60%),
    radial-gradient(90px 90px at 88% 28%, rgba(255,190,110,.25), transparent 60%),
    linear-gradient(180deg,#123 0%,#0c2436 42%,#0a1c2b 100%);
  filter:saturate(1.05);
}
.video-scene::after{ /* vignette */
  content:""; position:absolute; inset:0;
  background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(0,0,0,.55) 100%);
}
.video-frame{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
.video-frame.missing{ display:none; }

/* the "burned-in" hardcoded subtitle — cannot be turned off by the player */
.burned-sub{
  position:absolute; left:50%; bottom:8.5%; transform:translateX(-50%);
  z-index:2; text-align:center; width:86%; pointer-events:none;
  font-weight:700; letter-spacing:.5px;
  text-shadow:0 2px 5px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9);
}
.burned-sub .zh{ font-size:clamp(15px,2.05vw,30px); color:#fff; line-height:1.35; }
.burned-sub .en{ font-size:clamp(11px,1.25vw,17px); color:rgba(255,255,255,.86); margin-top:3px; font-weight:600; }

/* ----- Bili player control bar ----- */
.pbar{
  position:absolute; left:0; right:0; bottom:0; z-index:20;
  padding:0 14px 10px; opacity:0; transition:opacity .3s var(--ease);
  background:linear-gradient(180deg,transparent, rgba(0,0,0,.55));
}
.player:hover .pbar, .player.controls-on .pbar{ opacity:1; }
.pbar-progress{ height:4px; border-radius:99px; background:rgba(255,255,255,.28); position:relative; margin-bottom:8px; cursor:pointer; }
.pbar-progress .buf{ position:absolute; inset:0; width:64%; background:rgba(255,255,255,.34); border-radius:99px; }
.pbar-progress .played{ position:absolute; inset:0 auto 0 0; background:var(--bili-pink); border-radius:99px; }
.pbar-progress .knob{ position:absolute; top:50%; width:12px; height:12px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(0,0,0,.4); }
.pbar-row{ display:flex; align-items:center; gap:16px; color:#fff; }
.pbar-row .pb-btn{ color:#fff; display:grid; place-items:center; opacity:.92; }
.pbar-row .pb-btn:hover{ opacity:1; transform:scale(1.06); }
.pbar-time{ font-size:12px; color:rgba(255,255,255,.9); font-variant-numeric:tabular-nums; }
.pbar-spacer{ flex:1; }
.pbar-tag{ font-size:12px; color:rgba(255,255,255,.86); padding:2px 8px; border-radius:6px; background:rgba(255,255,255,.14); }

/* ----- Bili below-player action bar ----- */
.player-underbar{
  display:flex; align-items:center; gap:8px;
  height:44px; padding:0 14px; margin-top:1px;
  background:#fff; border-radius:0 0 6px 6px; color:var(--ink-2); font-size:13px;
}
.player-underbar .watching{ color:var(--ink-3); }
.pu-input{ flex:1; height:30px; border-radius:8px; background:#F1F2F3; display:flex; align-items:center; padding:0 6px 0 12px; color:var(--ink-3); font-size:13px; }
.pu-input .send{ margin-left:auto; background:#e7e7e7; color:var(--ink-3); height:24px; padding:0 12px; border-radius:6px; font-size:12px; }

.action-bar{ display:flex; align-items:center; gap:30px; padding:16px 6px; color:var(--ink-2); font-size:15px; border-bottom:1px solid var(--line); }
.action-bar .ab{ display:flex; align-items:center; gap:7px; }
.action-bar .ab:hover{ color:var(--bili-pink); cursor:pointer; }
.action-bar .spacer{ flex:1; }

/* ======================= Right sidebar ======================= */
.side-col{ display:flex; flex-direction:column; gap:14px; }
.up-card{ background:#fff; border-radius:8px; padding:14px 16px; display:flex; align-items:center; gap:12px; }
.up-avatar{ width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#5b86e5,#36d1dc); flex-shrink:0; }
.up-info{ min-width:0; flex:1; }
.up-name{ color:var(--bili-blue); font-weight:600; font-size:15px; display:flex; align-items:center; gap:6px; }
.up-sign{ color:var(--ink-3); font-size:12px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.up-btns{ display:flex; flex-direction:column; gap:8px; }
.up-follow{ background:var(--bili-blue); color:#fff; font-size:13px; height:32px; padding:0 14px; border-radius:8px; display:flex; align-items:center; gap:5px; white-space:nowrap; }
.up-charge{ background:#fff; border:1px solid var(--bili-pink); color:var(--bili-pink); font-size:13px; height:30px; padding:0 14px; border-radius:8px; display:flex; align-items:center; gap:5px; }

.danmaku-card, .eplist-card{ background:#fff; border-radius:8px; overflow:hidden; }
.dm-head{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); font-weight:600; font-size:14px; }
.ep-title{ padding:12px 16px 8px; display:flex; align-items:center; justify-content:space-between; }
.ep-title .t{ font-weight:600; font-size:14px; color:var(--bili-blue); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ep-sub{ padding:0 16px 10px; color:var(--ink-3); font-size:12px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); }
.ep-sub .sub-btn{ margin-left:auto; border:1px solid var(--bili-blue); color:var(--bili-blue); font-size:12px; padding:2px 10px; border-radius:6px; }
.ep-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 16px; font-size:14px; color:var(--ink-2); cursor:pointer; }
.ep-row:hover{ background:#F7F8FA; }
.ep-row.active{ background:#F1F8FF; color:var(--bili-blue); font-weight:600; }
.ep-row .time{ color:var(--ink-3); font-variant-numeric:tabular-nums; font-size:13px; }
.ep-row.active .time{ color:var(--bili-blue); }

.rec-card{ display:flex; gap:10px; }
.rec-thumb{ width:141px; height:80px; border-radius:6px; flex-shrink:0; position:relative; overflow:hidden; background:linear-gradient(135deg,#2b5876,#4e4376); }
.rec-thumb .dur{ position:absolute; right:5px; bottom:5px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; padding:1px 5px; border-radius:3px; }
.rec-thumb .tag4k{ position:absolute; left:5px; top:5px; background:rgba(0,0,0,.5); color:#9ce; font-size:9px; padding:1px 4px; border-radius:3px; font-weight:700; }
.rec-info{ min-width:0; flex:1; }
.rec-info .rt{ font-size:14px; color:var(--ink-1); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.rec-info .ru{ color:var(--ink-3); font-size:12px; margin-top:6px; display:flex; align-items:center; gap:4px; }
.rec-info .rstat{ color:var(--ink-3); font-size:12px; margin-top:4px; display:flex; gap:10px; }
.rec-list{ display:flex; flex-direction:column; gap:14px; }

/* ============================================================
   JustListen extension overlay
   ============================================================ */

/* --- Frosted subtitle mask (P0) --- */
.jl-mask{
  position:absolute; z-index:14; border-radius:14px; cursor:grab;
  background:var(--jl-glass);
  backdrop-filter:blur(15px) saturate(150%) brightness(1.04);
  -webkit-backdrop-filter:blur(15px) saturate(150%) brightness(1.04);
  border:1px solid var(--jl-stroke-soft);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 6px 22px rgba(0,0,0,.22);
  transition:opacity .28s var(--ease), backdrop-filter .28s var(--ease), background .28s var(--ease);
  touch-action:none; user-select:none;
}
.jl-mask.dragging{ cursor:grabbing; transition:none; }
.jl-mask.revealing{
  opacity:0;
  backdrop-filter:blur(0px);
  -webkit-backdrop-filter:blur(0px);
  background:transparent;
  pointer-events:none;
}
.jl-mask-hint{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:7px;
  color:var(--jl-text-2); font-size:12px; letter-spacing:.3px; opacity:0; transition:opacity .25s var(--ease);
  pointer-events:none;
}
.jl-mask:hover .jl-mask-hint{ opacity:1; }
.jl-mask .grip{ position:absolute; width:14px; height:14px; z-index:2; }
.jl-mask .grip::after{ content:""; position:absolute; inset:3px; border:2px solid rgba(255,255,255,.5); border-radius:2px; }
.jl-mask .grip.br{ right:-2px; bottom:-2px; cursor:nwse-resize; }
.jl-mask .grip.br::after{ border-left:none; border-top:none; }
.jl-mask .grip.bl{ left:-2px; bottom:-2px; cursor:nesw-resize; }
.jl-mask .grip.bl::after{ border-right:none; border-top:none; }
.jl-mask .grip.tr{ right:-2px; top:-2px; cursor:nesw-resize; }
.jl-mask .grip.tr::after{ border-left:none; border-bottom:none; }
.jl-mask .grip.tl{ left:-2px; top:-2px; cursor:nwse-resize; }
.jl-mask .grip.tl::after{ border-right:none; border-bottom:none; }
.jl-mask .edge-h{ position:absolute; left:14px; right:14px; height:8px; cursor:ns-resize; z-index:1; }
.jl-mask .edge-v{ position:absolute; top:14px; bottom:14px; width:8px; cursor:ew-resize; z-index:1; }

/* small reveal flash label shown while revealing */
.reveal-flash{
  position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:30;
  background:rgba(0,0,0,.4); backdrop-filter:blur(10px); color:#fff;
  padding:6px 14px; border-radius:99px; font-size:12px; letter-spacing:.4px;
  display:flex; align-items:center; gap:7px; pointer-events:none;
  opacity:0; transition:opacity .2s var(--ease);
}
.reveal-flash.on{ opacity:1; }

/* ==== Right-edge dock — light, collapsed to two small icons ==== */
/* shared */
.jl-dock{
  position:absolute; right:0; top:50%; transform:translateY(-50%); z-index:24;
  display:flex; flex-direction:column; align-items:center;
}
.dk-btn{
  position:relative; display:grid; place-items:center; color:var(--jl-text);
  transition:background .18s var(--ease), color .18s var(--ease);
}
.dk-tip{
  position:absolute; right:calc(100% + 9px); top:50%; transform:translateY(-50%) translateX(5px);
  background:rgba(24,26,34,.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  color:#fff; padding:5px 10px; border-radius:8px; font-size:12px; font-weight:600; white-space:nowrap;
  box-shadow:var(--jl-shadow); border:1px solid rgba(255,255,255,.12);
  opacity:0; pointer-events:none; transition:.18s var(--ease-out);
}
.dk-tip::after{ content:""; position:absolute; right:-4px; top:50%; width:8px; height:8px; transform:translateY(-50%) rotate(45deg); background:inherit; border-right:1px solid rgba(255,255,255,.12); border-top:1px solid rgba(255,255,255,.12); }
.dk-btn:hover .dk-tip{ opacity:1; transform:translateY(-50%) translateX(0); }

/* ① 细轨 rail — ultrathin frosted rail */
.v-rail{ gap:2px; padding:4px; border-radius:12px 0 0 12px;
  background:rgba(28,30,38,.4); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--jl-stroke); border-right:none; box-shadow:var(--jl-shadow);
  opacity:.5; transition:opacity .3s var(--ease); }
.player:hover .v-rail{ opacity:1; }
.v-rail .dk-btn{ width:29px; height:29px; border-radius:8px; }
.v-rail .dk-btn:hover{ background:var(--jl-glass-hi); }
.v-rail .dk-btn.on{ background:#fff; color:#111; }

/* ② 书签条 tab — flush bookmark, two stacked cells */
.v-tab{ border-radius:11px 0 0 11px; overflow:hidden;
  background:rgba(28,30,38,.44); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--jl-stroke); border-right:none; box-shadow:var(--jl-shadow);
  opacity:.55; transition:opacity .3s var(--ease); }
.player:hover .v-tab{ opacity:1; }
.v-tab .dk-btn{ width:32px; height:32px; }
.v-tab .dk-btn + .dk-btn{ border-top:1px solid var(--jl-stroke-soft); }
.v-tab .dk-btn:hover{ background:var(--jl-glass-hi); }
.v-tab .dk-btn.on{ background:#fff; color:#111; }

/* ③ 独立圆点 ghost — two separate glass circles */
.jl-dock.v-ghost{ right:9px; gap:8px; }
.v-ghost .dk-btn{ width:33px; height:33px; border-radius:50%;
  background:rgba(28,30,38,.42); backdrop-filter:blur(18px) saturate(180%); -webkit-backdrop-filter:blur(18px) saturate(180%);
  border:1px solid var(--jl-stroke); box-shadow:var(--jl-shadow); opacity:.62; transition:.24s var(--ease); }
.player:hover .v-ghost .dk-btn{ opacity:1; }
.v-ghost .dk-btn:hover{ background:rgba(40,42,52,.62); }
.v-ghost .dk-btn.on{ background:#fff; color:#111; opacity:1; }

/* ④ 点·展开 dot — a single brand dot that expands on hover */
.v-dot .dk-grip{ width:20px; height:46px; border-radius:10px 0 0 10px;
  background:rgba(28,30,38,.46); backdrop-filter:blur(18px) saturate(180%); -webkit-backdrop-filter:blur(18px) saturate(180%);
  border:1px solid var(--jl-stroke); border-right:none; display:grid; place-items:center; color:var(--jl-text-2);
  box-shadow:var(--jl-shadow); opacity:.6; transition:.25s var(--ease); }
.player:hover .v-dot .dk-grip{ opacity:.9; }
.v-dot .dk-pop{ position:absolute; right:0; top:50%; transform:translateY(-50%) translateX(10px);
  display:flex; flex-direction:column; gap:2px; padding:4px; border-radius:12px 0 0 12px;
  background:rgba(28,30,38,.5); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--jl-stroke); border-right:none; box-shadow:var(--jl-shadow);
  opacity:0; pointer-events:none; transition:.26s var(--ease-out); }
.v-dot:hover .dk-grip{ opacity:0; }
.v-dot:hover .dk-pop{ opacity:1; pointer-events:auto; transform:translateY(-50%) translateX(0); }
.v-dot .dk-btn{ width:29px; height:29px; border-radius:8px; }
.v-dot .dk-btn:hover{ background:var(--jl-glass-hi); }
.v-dot .dk-btn.on{ background:#fff; color:#111; }

/* --- Transcript panel (P1): frosted card floating on the right --- */
.jl-transcript{
  position:fixed; top:100px; right:28px; width:376px; z-index:80;
  max-height:calc(100vh - 140px);
  display:flex; flex-direction:column; overflow:hidden;
  background:rgba(252,252,253,.86);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);
  border-radius:var(--r-xl);
  box-shadow:0 24px 70px rgba(0,0,0,.24), 0 4px 14px rgba(0,0,0,.12);
  transform:translateX(24px) scale(.98); opacity:0; pointer-events:none;
  transform-origin:top right; transition:.32s var(--ease-out);
}
.jl-transcript.open{ transform:none; opacity:1; pointer-events:auto; }

.tr-head{ position:relative; padding:18px 18px 12px; }
.tr-eyebrow{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:1.4px; color:var(--jl-accent); }
.tr-title{ margin:6px 0 0; font-size:21px; font-weight:700; letter-spacing:-.4px; color:var(--ink-1); }
.tr-close{ position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:var(--ink-2); background:rgba(0,0,0,.05); transition:.15s var(--ease); }
.tr-close:hover{ background:rgba(0,0,0,.1); color:var(--ink-1); }

.tr-context{ display:flex; align-items:center; gap:8px; padding:0 18px 12px; color:var(--ink-2); font-size:12.5px; border-bottom:1px solid var(--line); }
.live-dot{ width:7px; height:7px; border-radius:50%; background:#34C759; box-shadow:0 0 0 3px rgba(52,199,89,.18); }
.tr-kbd{ margin-left:auto; color:var(--ink-3); font-size:11.5px; }
.tr-kbd b{ color:var(--ink-2); font-weight:600; }

.tr-list{ overflow-y:auto; padding:8px; flex:1; }
.tr-item{
  display:flex; align-items:flex-start; gap:10px;
  padding:11px 12px; border-radius:12px; cursor:pointer;
  transition:background .16s var(--ease);
}
.tr-item:hover{ background:rgba(0,0,0,.04); }
.tr-item.active{ background:var(--jl-accent-soft); }
.tr-item .tr-time{ color:var(--ink-3); font-size:11.5px; font-variant-numeric:tabular-nums; padding-top:2px; display:flex; align-items:center; gap:5px; min-width:38px; }
.tr-item.active .tr-time, .tr-item.playing .tr-time{ color:var(--jl-accent); }
.tr-body{ flex:1; min-width:0; }
.tr-text{ color:var(--ink-1); font-size:15px; line-height:1.45; }
.tr-item.active .tr-text{ font-weight:600; }
.tr-trans{ color:var(--ink-3); font-size:12.5px; margin-top:3px; line-height:1.45; }
.tr-item .now-dot{ width:6px; height:6px; border-radius:50%; background:var(--jl-accent); box-shadow:0 0 0 3px var(--jl-accent-soft); }
.tr-item > svg{ color:var(--ink-3); opacity:0; transform:translateX(-4px); transition:.16s var(--ease); margin-top:2px; flex-shrink:0; }
.tr-item:hover > svg, .tr-item.active > svg{ opacity:1; transform:none; }

/* bottom repeat sheet — controls for the selected sentence */
.repeat-sheet{ padding:14px 16px 16px; border-top:1px solid var(--line); background:rgba(255,255,255,.55); }
.rs-current{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.rs-label{ font-size:11px; color:var(--ink-3); background:rgba(0,0,0,.05); padding:2px 8px; border-radius:99px; flex-shrink:0; }
.rs-sentence{ font-size:14px; font-weight:600; color:var(--ink-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rs-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.rs-k{ font-size:12px; color:var(--ink-3); width:30px; flex-shrink:0; }
.seg{ display:flex; flex:1; background:rgba(0,0,0,.05); border-radius:9px; padding:3px; gap:3px; }
.seg button{ flex:1; font-size:12.5px; padding:6px 0; border-radius:6px; color:var(--ink-2); font-variant-numeric:tabular-nums; transition:.15s var(--ease); }
.seg button.on{ background:#fff; color:var(--ink-1); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12); }
.repeat-btn{
  height:44px; width:100%; border-radius:12px; margin-top:4px;
  background:var(--jl-accent); color:#fff; font-size:14.5px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:8px; transition:.18s var(--ease);
}
.repeat-btn:hover{ filter:brightness(1.06); }
.repeat-btn.looping{ background:#111; }
.repeat-count-pill{ font-size:11px; background:rgba(255,255,255,.25); padding:2px 8px; border-radius:99px; }

/* looping status ring on player */
.loop-status{
  position:absolute; top:12px; left:12px; z-index:22;
  display:flex; align-items:center; gap:8px; padding:7px 13px 7px 10px;
  background:rgba(20,22,28,.5); backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  border:1px solid var(--jl-stroke); border-radius:99px; color:var(--jl-text); font-size:12.5px;
  box-shadow:var(--jl-shadow); opacity:0; transform:translateY(-6px);
  transition:.3s var(--ease-out); pointer-events:none;
}
.loop-status.on{ opacity:1; transform:translateY(0); pointer-events:auto; }
.loop-status .lp-x{ color:var(--jl-text-3); font-variant-numeric:tabular-nums; }
.loop-status .lp-stop{ margin-left:4px; width:22px; height:22px; border-radius:50%; background:var(--jl-glass-hi); display:grid; place-items:center; pointer-events:auto; cursor:pointer; }
.loop-status .lp-stop:hover{ background:rgba(255,255,255,.22); }
.spin{ animation:spin 2.4s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ======================= Tweaks (variant) panel ======================= */
.tweaks-toggle{
  position:fixed; right:22px; bottom:22px; z-index:120;
  height:46px; padding:0 18px; border-radius:99px;
  background:rgba(24,26,34,.86); backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  color:#fff; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px;
  box-shadow:0 10px 34px rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.14);
  transition:.2s var(--ease);
}
.tweaks-toggle:hover{ transform:translateY(-2px); }
.tweaks-panel{
  position:fixed; right:22px; bottom:80px; z-index:120; width:320px;
  background:rgba(250,250,252,.86); backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.6); border-radius:var(--r-xl);
  box-shadow:0 24px 60px rgba(0,0,0,.22); padding:18px;
  transform:translateY(12px) scale(.98); opacity:0; pointer-events:none;
  transform-origin:bottom right; transition:.26s var(--ease-out);
}
.tweaks-panel.open{ transform:translateY(0) scale(1); opacity:1; pointer-events:auto; }
.tw-title{ font-size:12px; font-weight:700; color:var(--ink-3); letter-spacing:.6px; text-transform:uppercase; margin:2px 0 12px; }
.tw-group{ margin-bottom:18px; }
.tw-label{ font-size:13px; font-weight:600; color:var(--ink-1); margin-bottom:8px; }
.tw-hint{ font-size:11.5px; color:var(--ink-3); margin-top:6px; line-height:1.5; }
.variant-opts{ display:flex; flex-direction:column; gap:8px; }
.variant-opt{
  text-align:left; padding:11px 13px; border-radius:12px; border:1px solid var(--line);
  background:#fff; transition:.18s var(--ease);
}
.variant-opt:hover{ border-color:#c9d3dd; }
.variant-opt.on{ border-color:var(--jl-accent); background:var(--jl-accent-soft); }
.variant-opt .vo-name{ font-size:13.5px; font-weight:600; color:var(--ink-1); display:flex; align-items:center; gap:8px; }
.variant-opt .vo-desc{ font-size:11.5px; color:var(--ink-2); margin-top:3px; line-height:1.45; }
.variant-opt .vo-dot{ width:9px; height:9px; border-radius:50%; border:2px solid var(--ink-3); flex-shrink:0; }
.variant-opt.on .vo-dot{ border-color:var(--jl-accent); background:var(--jl-accent); box-shadow:inset 0 0 0 2px #fff; }
.tw-switchrow{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; }
.tw-switchrow .swl{ font-size:13px; color:var(--ink-1); }
.switch{ width:42px; height:25px; border-radius:99px; background:#D1D5DB; position:relative; transition:.2s var(--ease); flex-shrink:0; }
.switch.on{ background:var(--jl-accent); }
.switch::after{ content:""; position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:.2s var(--ease-out); }
.switch.on::after{ transform:translateX(17px); }
.slider{ width:100%; accent-color:var(--jl-accent); }

/* onboarding coach hint */
.coach{
  position:absolute; z-index:40; max-width:230px;
  background:rgba(24,26,34,.92); backdrop-filter:blur(14px); color:#fff;
  padding:12px 14px; border-radius:14px; font-size:12.5px; line-height:1.5;
  box-shadow:var(--jl-shadow); border:1px solid rgba(255,255,255,.12);
}
.coach .ch-t{ font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
.coach .ch-actions{ margin-top:10px; display:flex; gap:8px; }
.coach .ch-btn{ font-size:12px; padding:5px 12px; border-radius:8px; background:#fff; color:#111; font-weight:600; }
.coach .ch-skip{ font-size:12px; padding:5px 10px; color:var(--jl-text-2); }
.coach::after{ content:""; position:absolute; width:12px; height:12px; background:inherit; transform:rotate(45deg); }

.fade-in{ animation:fadeIn .5s var(--ease-out) both; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
</style>
</head>
